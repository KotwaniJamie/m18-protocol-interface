<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackCheck</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="titlebar">
  <div class="logo" aria-label="PackCheck"><span class="pack">PACK</span><span class="check">CHECK</span></div>
  <div class="spacer"></div>
  <div id="pill" class="pill" role="status"><span class="dot"></span><span id="pill-text">Starting…</span></div>
  <button class="btn" id="open-btn">Open a saved scan</button>
</header>
<main id="main"></main>
<footer>PackCheck is an independent open-source tool. Not affiliated with or endorsed by Milwaukee Tool.</footer>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
