<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackCheck</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-left"><button type="button" class="tb-btn" id="open-btn">Saved scans</button></div>
    <div class="brand" role="img" aria-label="PackCheck"><span class="pack">PACK</span><span class="check">CHECK</span></div>
    <div class="tb-right"><div id="pill" class="safe" role="status"><i></i><span id="pill-text">STARTING</span></div></div>
  </header>
  <main class="body" id="main"></main>
</div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
